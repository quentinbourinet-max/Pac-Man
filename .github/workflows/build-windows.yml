name: Générer l'exécutable Windows

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Récupérer le code du projet
      uses: actions/checkout@v4

    - name: Configurer Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Installer PyInstaller et les dépendances
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller pygame
        pip install pydantic
        pip install mazegen-1.0.0-py3-none-any.whl

    - name: Compiler avec PyInstaller
      run: |
        # Ajout de --onefile et modification de ":" en ";"
        pyinstaller --onefile --clean --noconsole --add-data "data;data" pac-man.py 

    - name: Créer le pack de jeu (EXE + DATA)
      run: |
        # Utilisation de la syntaxe PowerShell native pour éviter les erreurs
        New-Item -ItemType Directory -Force -Path release
        Copy-Item -Path dist\pac-man.exe -Destination release\
        Copy-Item -Path data -Destination release\data -Recurse
        Compress-Archive -Path release\* -DestinationPath PacMan42-Windows.zip

    - name: Mettre à disposition le fichier ZIP
      uses: actions/upload-artifact@v4
      with:
        name: PacMan42-Windows-Version
        path: PacMan42-Windows.zip
