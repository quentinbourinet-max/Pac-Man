name: Build Windows executable

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Check out the project code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install PyInstaller and dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller pygame
        pip install pydantic
        pip install deps/mazegen-1.0.0-py3-none-any.whl

    - name: Build with PyInstaller
      run: |
        # --onefile bundles everything; on Windows --add-data uses ";"
        pyinstaller --onefile --clean --noconsole --add-data "data;data" pac-man.py

    - name: Assemble the game pack (EXE + DATA)
      run: |
        # Native PowerShell syntax to avoid shell errors
        New-Item -ItemType Directory -Force -Path release
        Copy-Item -Path dist\pac-man.exe -Destination release\
        Copy-Item -Path data -Destination release\data -Recurse
        Compress-Archive -Path release\* -DestinationPath PacMan42-Windows.zip

    - name: Upload the ZIP file
      uses: actions/upload-artifact@v4
      with:
        name: PacMan42-Windows-Version
        path: PacMan42-Windows.zip
