[project]
name = "pac-man"
version = "1.0.0"
description = "Two-peers complete python game project, from 42next common core curriculum."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pygame>=2.6",
    "mazegen @ ./tools/mazegen-1.0.0-py3-none-any.whl",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "flake8>=7.0",
]
