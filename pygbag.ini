[pygbag]
# Votre fichier principal
main = main.py
# Inclure vos bibliothèques locales
app_extensions = mazegen-1.0.0-py3-none-any.whl
# Liste des paquets PyPI requis (Pydantic et Pygame sont supportés par pygbag)
packages = pydantic, pygame-ce

[DEPENDENCIES]
# pygbag exige cette section. On lui indique de ne rien ignorer par défaut.
ignorefiles =
ignoredirs =